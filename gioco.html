<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gioca - Circuit Chase</title>
  <link rel="stylesheet" href="gioco.css">
</head>
<body class="gioco-pagina">
  <main class="gioco-contenuto">
    <h1>CIRCUIT CHASE</h1>
    <p class="sottotitolo">Raccogli tutti i chip senza farti catturare dai virus</p>
    <p class="istruzioni-gioco">Muovi con le frecce o W A S D. Premi P per mettere in pausa o riprendere.</p>
    <label for="nome-giocatore">Inserisci il tuo nikname:</label>
    <input type="text" class="info-box">
    <p><strong>Scegli la difficoltà con cui vuoi giocare: </strong></p>
    <div class="modalita"><button class="btn difficolta" id="facile">Facile</button>
      <button class="btn difficolta" id="medio">Medio</button>
      <button class="btn difficolta" id="difficile">Difficile</button></div>
    <p>Punteggio: <strong id="punteggio">0</strong></p>
    <div id="tabellone" class="gioco-tabellone"></div>
    <button class="btn" id="gioca">Gioca</button>
    <p id="stato-gioco" class="stato">Caricamento del gioco...</p>
    <button class="btn torna-sito" id="torna-sito">&#8592; Torna al sito</button>
  </main>
  <script src="gioco.js"></script>
</body>
</html>
